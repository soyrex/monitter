[package]
name = "monitter"
version = "0.1.0"
description = "Local and SSH agent workspace"
authors = ["Alex Holt"]
edition = "2021"
default-run = "monitter"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jiff = "0.2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
portable-pty = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSEvent",
    "NSResponder",
    "NSWindow",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
