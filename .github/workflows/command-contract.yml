name: Harness contracts and regressions

on:
  pull_request:
  push:

jobs:
  contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run contract:check
      - run: npm run test:command-protocol
      - run: npm run test:command-contract
      - run: npm run check
      - run: npx playwright install webkit
      - run: npm run test:ui-sync
      - run: ./node_modules/.bin/vite build
      - run: python3 scripts/check-jev-evaluation-fixtures.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=2
