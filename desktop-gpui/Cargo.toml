[package]
name = "monitter-gpui-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
visual-export = ["gpui-kit/test-support", "monitter/gpui-ui-fixtures"]
performance-profiling = ["gpui-pre/profiler", "monitter/gpui-ui-fixtures", "gpui-wry/performance-profiling"]

[dependencies]
anyhow = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
argon2 = "=0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
gpui-kit = { version = "=0.7.0", features = [
    "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-bash",
    "tree-sitter-css", "tree-sitter-html", "tree-sitter-yaml",
    "tree-sitter-toml", "tree-sitter-go", "tree-sitter-diff",
] }
gpui-wry = { path = "vendor/gpui-wry" }
wry = "=0.55.1"
url = "2"
monitter = { path = "../src-tauri", features = ["experimental-gpui"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
im = "=15.1.0"
unicode-segmentation = "=1.13.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ammonia = "=4.2.0"
base64 = "0.22"
raw-window-handle = "0.6"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm"] }
vt100 = "=0.16.2"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.1"
gpui-pre = { version = "=0.3.7", features = ["frame-capture"] }
gpui-pre-macos = { version = "=0.3.7", features = ["frame-capture"] }
gpui-pre-apple = { version = "=0.3.7", features = ["frame-capture"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSApplication", "NSResponder", "NSButton", "NSControl", "NSView", "NSAppearance", "NSVisualEffectView", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSObjCRuntime", "NSBundle", "NSDictionary", "NSValue", "NSURL"] }
block2 = "0.6"
libc = "0.2"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["AVAudioRecorder", "AVAudioSettings"] }

# Keep the native layout/render engine fast in experimental debug previews.
# Application code retains normal debug checks and diagnostics.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 3
