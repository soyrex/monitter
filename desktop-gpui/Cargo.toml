[package]
name = "monitter-gpui-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[features]
visual-export = ["gpui-kit/test-support", "monitter/gpui-ui-fixtures"]
performance-profiling = ["gpui-pre/profiler", "monitter/gpui-ui-fixtures", "gpui-wry/performance-profiling"]

[dependencies]
nsh-platform-gpui = { path = "vendor/nsh-platform-gpui", default-features = false, features = ["js"] }
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
anyhow = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
argon2 = "=0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
gpui-kit = { version = "=0.7.0", features = [
    "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-bash",
    "tree-sitter-css", "tree-sitter-html", "tree-sitter-yaml",
    "tree-sitter-toml", "tree-sitter-go", "tree-sitter-diff",
] }
gpui-wry = { path = "vendor/gpui-wry" }
wry = "=0.55.1"
url = "2"
monitter = { path = "../src-tauri", features = ["experimental-gpui"] }
serde_json = "1"
qrcode = { version = "=0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
im = "=15.1.0"
unicode-segmentation = "=1.13.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ammonia = "=4.2.0"
base64 = "0.22"
p256 = { version = "=0.14.0", features = ["ecdh"] }
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
tungstenite = { version = "=0.28.0", features = ["rustls-tls-native-roots"] }
raw-window-handle = "0.6"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm"] }
vt100 = "=0.16.2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
nsh-bundler = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast/compat/gpui-fast" }
gpui-fast-platform = { path = "vendor/gpui-fast/compat/gpui-fast-platform" }
gpui-pre-platform = { path = "vendor/gpui-fast/compat/gpui-pre-platform" }
gpui-pre-macros = { path = "vendor/gpui-fast/compat/gpui-pre-macros" }
gpui-pre-sum-tree = { path = "vendor/gpui-fast/compat/gpui-pre-sum-tree" }
gpui-pre-web = { path = "vendor/gpui-fast/compat/gpui-pre-web" }
gpui-pre = { path = "vendor/gpui-fast/compat/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-fast/compat/gpui-pre-macos" }
gpui-pre-apple = { path = "vendor/gpui-fast/compat/gpui-pre-apple" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.1"
gpui-pre = { version = "=0.3.7", features = ["frame-capture"] }
gpui-pre-macos = { version = "=0.3.7", features = ["frame-capture"] }
gpui-pre-apple = { version = "=0.3.7", features = ["frame-capture"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSApplication", "NSAlert", "NSRunningApplication", "NSWorkspace", "NSResponder", "NSButton", "NSControl", "NSView", "NSAppearance", "NSVisualEffectView", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSObjCRuntime", "NSBundle", "NSDictionary", "NSValue", "NSURL", "NSArray"] }
block2 = "0.6"
libc = "0.2"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["AVAudioRecorder", "AVAudioSettings"] }

# Keep the native layout/render engine fast in experimental debug previews.
# Application code retains normal debug checks and diagnostics.
[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 3
