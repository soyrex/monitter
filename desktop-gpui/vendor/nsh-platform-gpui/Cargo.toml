[package]
name = "nsh-platform-gpui"
description = "GPUI backend (macOS, Windows, Linux): nsh apps drawn by GPUI, embeddable in GPUI and GPUI Kit apps."
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
homepage = "https://nsh.dev"
readme = "README.md"
repository = "https://github.com/longbridge/nsh"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[features]
default = ["js", "webview"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "dep:nsh-dev"]
# `shot` script steps on macOS and Windows: GPUI renders the window's
# frame offscreen (its `test-support`; development hosts only).
shot = ["gpui/test-support", "gpui_platform/test-support"]
# Compile GPUI's Metal shaders at run time (macOS), so building needs no Metal
# Toolchain (`xcodebuild -downloadComponent MetalToolchain`).
runtime-shaders = ["gpui_platform/runtime_shaders"]
# Web views (wry; on Linux GTK 3 and WebKitGTK 4.1, on an X11 window).
webview = ["dep:wry", "dep:gtk", "dep:webkit2gtk"]
# Videos (GStreamer 1.20+ with its base and good plug-ins; libav for most
# codecs).
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
log = "0.4"

# Empty off the desktop (like the other platform crates off their targets).
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
gpui = { package = "gpui-fast", version = "0.1.9", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.9", default-features = false, features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg", "bmp", "ico", "tiff"] }
rustc-hash = "2.1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdb = "0.23"
serde_json = "1"
ttf-parser = "0.25"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
ureq = "3.1"
base64 = "0.22"
anyhow = "1"
crossbeam-channel = "0.5"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nsh-dev = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false, features = ["client"], optional = true }
wry = { package = "lb-wry", version = "0.53.3", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's settings (XDG settings portal, AT-SPI).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# `shot` script steps read the window from the X server.
raw-window-handle = "0.6"
x11rb = { version = "0.13", default-features = false, features = ["dri3", "present"] }
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "=2.0.1", features = ["v2_38"], optional = true }


# A whole app: tests do not build it.
[[example]]
name = "embed"
test = false

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }

# Tests in windows of GPUI's test platform (feature `shot`) compile
# their apps.
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dev-dependencies]
nsh-bundler = { git = "https://github.com/longbridge/nsh.git", rev = "c1511fa4dda6ce2ed04e8f47ed087a1e7dee876b", default-features = false }
gpui = { package = "gpui-fast", version = "0.1.9", default-features = false, features = ["test-support"] }

[workspace]
